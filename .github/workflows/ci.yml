name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Skills
        run: python3 scripts/validate_skills.py
      - name: Check changed files for release safety
        run: python3 scripts/check_release_safety.py
